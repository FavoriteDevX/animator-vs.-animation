<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Stickman — 24H Interactive Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra superior discreta de controle -->
    <header class="top-bar">
        <div class="brand">
            <span class="dot" id="status-dot"></span>
            <h1>Living Stickman</h1>
        </div>

        <div class="controls">
            <label for="sprite-input" class="btn-upload">
                Upload Stickman PNG
                <input type="file" id="sprite-input" accept="image/png, image/jpeg, image/gif, image/webp">
            </label>
            <button id="btn-activate" class="btn-primary">Activate (24H)</button>
            <button id="btn-popout" class="btn-secondary" title="Or drag the stickman outside the browser window!">Pop-out to Desktop</button>
        </div>

        <div class="timer-display" id="timer-display">Dormant — Upload or click Activate</div>
    </header>

    <!-- Palco principal onde o boneco vive livremente -->
    <main id="stage">
        <div class="hint-overlay" id="hint-text">
            Tip: Grab your stickman with the mouse and <strong>drag it outside the browser window</strong> to pop it onto your desktop!
        </div>
        
        <!-- Objetos interativos dentro da tela para ele brincar -->
        <div class="stage-prop" id="prop-box" style="left: 20%; bottom: 20px;">📦</div>
        <div class="stage-prop" id="prop-ball" style="left: 75%; bottom: 20px;">⚽</div>
    </main>

    <script src="stickman-life.js"></script>
    <script src="app.js"></script>
</body>
</html>
