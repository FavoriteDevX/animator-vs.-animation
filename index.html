<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick Figure Life Simulator — 24H Desktop Pet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Stick Figure Life Simulator</h1>
            <p class="subtitle">Upload your stickman PNG sprite, configure its AI traits, and bring it to life on your laptop screen for <strong>24 hours</strong>.</p>
        </header>

        <section class="upload-section">
            <label for="sprite-upload" class="drop-zone" id="drop-zone">
                <div class="preview-wrapper">
                    <img id="sprite-preview" alt="Stickman Preview">
                </div>
                <span id="upload-text">Click or drag your Stickman PNG here<br><small>(Transparent background recommended)</small></span>
                <input type="file" id="sprite-upload" accept="image/png, image/jpeg, image/gif, image/webp">
            </label>
        </section>

        <section class="traits-panel">
            <h2>Programmer Mode — AI Configuration</h2>
            <div class="grid">
                <div class="control-group">
                    <label>Speed: <span id="speed-val">4</span></label>
                    <input type="range" id="stat-speed" min="1" max="10" value="4">
                </div>
                <div class="control-group">
                    <label>Jump Power: <span id="jump-val">12</span></label>
                    <input type="range" id="stat-jump" min="6" max="20" value="12">
                </div>
            </div>

            <div class="toggles">
                <label><input type="checkbox" id="sense-vision" checked> Vision (Chases Mouse)</label>
                <label><input type="checkbox" id="feeling-happy" checked> Happiness (Random Jumps)</label>
                <label><input type="checkbox" id="feeling-curious" checked> Curiosity (Talks & Explores)</label>
            </div>
        </section>

        <section class="actions">
            <button id="btn-activate" class="btn primary">BRING TO LIFE (24H CYCLE)</button>
            <button id="btn-pip" class="btn secondary">FLOAT OVER OTHER APPS (DESKTOP MODE)</button>
        </section>

        <footer class="status-bar">
            <div id="life-timer">Status: Dormant (Ready to activate)</div>
        </footer>
    </main>

    <script src="pet-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
